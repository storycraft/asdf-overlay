[package]
name = "asdf-overlay-node"
description = "Asdf Overlay Node Addon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"

[lib]
crate-type = ["cdylib"]

[dependencies]
asdf-overlay-client = { workspace = true }
asdf-overlay-surface-util = { workspace = true }

tokio = { workspace = true, features = ["full"] }
napi-derive = "3.6.2"

anyhow = "1.0.97"
once_cell = "1.21.3"
mimalloc = "0.1.46"
bytemuck = { version = "1.22.0", features = ["extern_crate_std"] }
parking_lot = { version = "0.12.3", features = ["hardware-lock-elision"] }
futures = "0.3.31"
num = "0.4.3"
sync_wrapper = "1.0.2"

[dependencies.napi]
version = "3.12.0"
features = ["napi8", "async", "error_anyhow", "deferred_trace"]

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
]

[build-dependencies]
napi-build = "2"

[target.'cfg(target_env = "msvc")'.build-dependencies]
static_vcruntime = "3"
