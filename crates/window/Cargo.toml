[package]
name = "asdf-overlay-window"
description = "Asdf Overlay window handling and input library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"

[dependencies]
asdf-overlay-common = { workspace = true }
asdf-overlay-hook = { workspace = true }

tracing = "0.1"
anyhow = "1.0.97"
parking_lot = { version = "0.12.3", features = ["hardware-lock-elision"] }
once_cell = "1.21.3"

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_Globalization"
]