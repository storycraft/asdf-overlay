[package]
name = "asdf-overlay"
description = "Asdf Overlay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"

[dependencies]
asdf-overlay-event = { workspace = true }
asdf-overlay-hook = { workspace = true }

tracing = "0.1"
anyhow = "1.0.97"
parking_lot = { version = "0.12.3", features = ["hardware-lock-elision"] }
once_cell = "1.21.3"
scopeguard = "1.2.0"
dashmap = "6.1.0"
nohash-hasher = "0.2.0"
array-util = "1.0.2"
arc-swap = "1.7.1"
windows-core = "0.62.2"

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D9",
    "Win32_Graphics_Direct3D10",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
]

[build-dependencies]
anyhow = "1.0.97"
gl_generator = "0.14.0"

[dev-dependencies]
winit = "0.30.13"
eframe = { version = "0.36.1", features = ["glow"] }
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }

[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-msvc"]
